name: ci

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - run: corepack enable
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm lint:types
            - run: pnpm format:check
            - run: pnpm check
            - run: pnpm build
            - run: pnpm test
            - run: pnpm perf-smoke
